<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRS Conversion</title>
    <link rel="icon" type="image/x-icon" href="../static/images/flavicon.png">
    <link rel="stylesheet" href="{{ url_for('static', filename='workflow.css') }}">
    <style>
        .container {
            max-width: 500px;
        }
        .error-message {
            white-space: pre-wrap;
        }
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        label {
            margin-bottom: 10px;
            font-size: 18px;
        }
        input[type="text"] {
            width: 33.33%;
            padding: 10px;
            margin-bottom: 20px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        @media (max-width: 768px) {
            input[type="text"] {
                width: 50%;
            }
        }
        @media (max-width: 480px) {
            input[type="text"] {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="../static/images/logo1.png" alt="Logo 1" class="logo">
        <a href="https://3d.bk.tudelft.nl/"><img src="../static/images/logo2.png" alt="Logo 2" class="logo"></a>
    </div>
    <div class="container">
        <h1>CRS Conversion</h1>
        
        {% if message %}
        <pre class="error-message">{{ message | safe }}</pre>
        {% endif %}
        
        <form method="POST" onsubmit="showLoader()">
            <label for="epsg_code">Enter the EPSG code for the Target CRS:</label>
            <input type="text" id="epsg_code" name="epsg_code" required>
            <input type="submit" value="Convert" class="btn">
        </form>
        
        <div class="loader" id="loader">
            <img src="{{ url_for('static', filename='images/loading.png') }}" alt="Loading...">
        </div>
    </div>

    <script>
        function showLoader() {
            document.getElementById('loader').style.display = 'block';
        }
    </script>
</body>
</html>
